name: Build APK (simple)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: "Tipo de build"
        type: choice
        default: debug
        options: [debug, release]
      abi:
        description: "Arquitectura"
        type: choice
        default: arm64
        options: [arm64, universal]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Fetch submodules if missing
        shell: bash
        run: |
          set -euo pipefail
          for m in core lyrics IconPack morideobfuscator; do
            if [ -z "$(ls -A "$m" 2>/dev/null)" ]; then
              rm -rf "$m"
              git clone --depth 1 "https://github.com/rukamori/$m.git" "$m"
            fi
          done

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Create temporary release keystore
        if: inputs.variant == 'release'
        shell: bash
        run: |
          mkdir -p app/keystore
          keytool -genkeypair -keystore app/keystore/release.keystore \
            -alias archivetune -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=ArchiveTune Test, O=Personal, C=AR"
          {
            echo "STORE_PASSWORD=android123"
            echo "KEY_ALIAS=archivetune"
            echo "KEY_PASSWORD=android123"
          } >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          chmod +x gradlew
          ABI="${{ inputs.abi || 'arm64' }}"
          V="${{ inputs.variant || 'debug' }}"
          ABI_CAP="$(tr '[:lower:]' '[:upper:]' <<< "${ABI:0:1}")${ABI:1}"
          V_CAP="$(tr '[:lower:]' '[:upper:]' <<< "${V:0:1}")${V:1}"
          ./gradlew "assembleGmsMobile${ABI_CAP}${V_CAP}" --stacktrace

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name "*.apk" -exec cp {} dist/ \;
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: ArchiveTune-${{ inputs.variant || 'debug' }}-${{ inputs.abi || 'arm64' }}
          path: dist/*.apk
          if-no-files-found: error
